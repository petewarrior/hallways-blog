<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hallways Blog</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
</head>
<body class="is-preloading">
    <div id="loading-screen" role="status" aria-live="polite">
        <span id="loading-status">Preparing the hallway...</span>
    </div>
    <div id="ui-overlay">
        <button id="back-button" class="hidden" type="button" aria-label="Return to lobby">← Back</button>
        <div id="room-label">LOBBY</div>
    </div>

    <a-scene stats id="scene" fog="type: linear; color: #333; near: 15; far: 100"
             renderer="antialias: true; colorManagement: true;">

        <a-assets>
            <a-asset-item id="hallway-model" src="assets/models/hallway_4x4x10/hallway_4x4x10.gltf"></a-asset-item>
        </a-assets>

        <a-entity id="rig" position="0 0 0">
            <a-entity id="camera" camera look-controls position="0 1.6 0">
                <a-entity cursor="fuse: false; rayOrigin: mouse" raycaster="objects: .scrollable; far: 100"></a-entity>
            </a-entity>
            <a-entity id="left-controller" laser-controls="hand: left" raycaster="objects: .scrollable; far: 12"></a-entity>
            <a-entity id="right-controller" laser-controls="hand: right" raycaster="objects: .scrollable; far: 12"></a-entity>
        </a-entity>

        <a-entity id="hallway-preloader" gltf-model="#hallway-model" visible="false"></a-entity>

        <a-entity id="lobby-container"></a-entity>

        <a-entity id="hallway-container" visible="false">
            <a-entity id="room-container"></a-entity>
        </a-entity>

        <a-sky color="#ECECEC"></a-sky>
        <a-entity light="type: ambient; color: #FFF; intensity: 0.8"></a-entity>
        <a-entity light="type: directional; color: #FFF; intensity: 0.6" position="1 3 1"></a-entity>
    </a-scene>

    <canvas id="post-canvas" width="1200" height="800" aria-hidden="true"></canvas>
    <script src="src/post-scrollbar.js"></script>
    <script type="module" src="main.js"></script>
</body>
</html>
